services:
  - type: web
    name: axiom-llm-service
    runtime: docker
    plan: starter # 2GB RAM / 1 vCPU ($7/mo) - optimal for Llama 3.2 1B Q4
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: MODEL_REPO
        value: "meta-llama/Llama-3.2-1B"
      - key: MODEL_FILE
        value: ""
      - key: N_THREADS
        value: "2"
      - key: N_CTX
        value: "4096"
      - key: API_KEY
        generateValue: true # Generates secure key, or specify your own
      - key: HF_TOKEN
        sync: false # Set your Hugging Face Token (hf_...) for official meta-llama gated access
    healthCheckPath: /health
