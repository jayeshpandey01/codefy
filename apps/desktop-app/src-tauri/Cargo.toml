[package]
name = "whoami-desktop-app"
version = "0.1.0"
description = "WhoAmI -- real-time bug/vulnerability finder (Tauri desktop shell)"
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app/v1/guides/getting-started/setup/next-js#update-tauri-conf-json
[lib]
name = "whoami_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No custom #[tauri::command]s are registered anywhere in this crate -- a
# direct consequence of the Worker-only architecture: the frontend only ever
# calls the dialog/fs plugins' own JS APIs (see src/bridge/workspaceFs.ts),
# never a bespoke Rust command. See src/lib.rs.
